[project]
name = "dld-mcp"
version = "0.3.0"
description = "MCP server for Dubai real estate - DLD transactions and Ejari rentals"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "OfferBrief", email = "hello@offerbrief.com" }
]
keywords = ["mcp", "dubai", "real-estate", "dld", "property", "ejari", "rentals", "uae"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "mcp>=2,<3",
    "httpx>=0.27.0",
    "pydantic>=2.12",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.12",
]

[project.scripts]
dld-mcp = "dld_mcp:main"

[project.urls]
Homepage = "https://offerbrief.com"
Repository = "https://github.com/level09/dld-mcp"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dld_mcp"]

[tool.ruff]
line-length = 120
target-version = "py310"
